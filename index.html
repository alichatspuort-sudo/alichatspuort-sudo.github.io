<script src="entries.js"></script>
<script>
  const TOTAL_DAYS = 15;
  const log = document.getElementById('log');

  const sorted = [...ENTRIES].sort((a, b) => b.day - a.day);

  document.getElementById('day-label').textContent = `Day ${sorted[0]?.day || 0} of ${TOTAL_DAYS}`;
  const fillEl = document.getElementById('progress-fill');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fillEl.style.width = `${((sorted[0]?.day || 0) / TOTAL_DAYS) * 100}%`;
  }));

  sorted.forEach(e => {
    const entry = document.createElement('article');
    entry.className = 'entry';
    entry.innerHTML = `
      <div class="daymark">${String(e.day).padStart(2, '0')}</div>
      <div class="meta">
        <span>${e.date}</span>
        <span class="badge">Day ${e.day}</span>
      </div>
      <h2>${e.tool}</h2>
      <a class="tool-link" href="${e.url}" target="_blank" rel="noopener noreferrer">Visit ${e.tool} &rarr;</a>
      <p class="desc">${e.description}</p>
      <div class="prompt-box">
        <div class="label">Prompts to try with this tool</div>
        <ul>${e.prompts.map(p => `<li>${p}</li>`).join('')}</ul>
      </div>
    `;
    log.appendChild(entry);
  });

  // Reveal entries as they scroll into view
  const observer = new IntersectionObserver((items) => {
    items.forEach(item => {
      if (item.isIntersecting) {
        item.target.classList.add('is-visible');
        observer.unobserve(item.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.entry').forEach(el => observer.observe(el));
</script>
